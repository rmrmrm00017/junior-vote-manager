const KEY='junior-vote-ledger-v1';let dealFilter='all',showTrash=false;const DEFAULT_CATEGORIES=["恋人にしたい","友だちにしたい","弟にしたい","お兄さんにしたい","先輩になってほしい","後輩になってほしい","学校の先生になってほしい","キスしてみたい","いちばんおしゃれ","私服がダサそう","いちばんセクシー","いちばんおもしろい","いちばん美形","いちばん美声","ダンスがカッコいい","グローバルに活躍しそう","演技がうまい","絵がヘタそう","恋人に尽くしそう","女装が似合いそう","秒でメールの返信がきそう","天然キャラっぽい","泣き虫そう","ナルシストっぽい","ニュースキャスターになりそう","いちばんいいコンビ","私のリア恋枠","いちばんMCがうまい","意外とメガネが似合いそう","御曹司っぽい","手料理が食べたい","いい匂いがしそう","いちばんもちもち","犬っぽい","猫っぽい","少女マンガの主人公に片思いするけど、報われないキャラっぽい","少女マンガでライバルになりそうなふたり","意外と脱いだらムキムキ","国民の元カレ","なかよし３人組","しぐさがメロい","いちばんバブい","いちばん美肌","塩抜き中のアサリに名前をつけそう","ヘッダーに小さく収めたい","となりの席に座りたい","いっしょに補習を受けたい","テスト前に「全然勉強してない」といいつつ、わりと勉強してそう","修学旅行でいっしょの班になりたい","文化祭でテンション上がって、公開告白しそう","制服を個性的に着こなしそう","お弁当が大きそう","ドッジボールでボールが当たらないようにかばってくれそう","放課後デートしたい"];let state=read(),tab='home',query='';function read(){let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}if(!data.seeded54){data.categories=[...new Set([...DEFAULT_CATEGORIES,...(data.categories||[])])];data.deadline='2026-12-01';data.seeded54=true;try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}return data}function initial(){return {title:'ジュニア大賞',deadline:'2026-12-01',copies:0,categories:[...DEFAULT_CATEGORIES],reserved:{},deals:[],purchases:[],seeded54:true,featuredCat:'いちばんいいコンビ'}}let toastTimer;function savedNotice(){let t=document.getElementById('saveToast');if(!t)return;try{if(!t.matches(':popover-open'))t.showPopover();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(t.matches(':popover-open'))t.hidePopover()},2400)}catch{t.classList.add('toast-fallback');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('toast-fallback'),2400)}}function save(){localStorage.setItem(KEY,JSON.stringify(state));render();savedNotice()}function downloadBackup(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='junior-vote-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function safeImage(value){return typeof value==='string'&&/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(value)&&value.length<2800000?value:''}function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return Number(n||0).toLocaleString('ja-JP')}function available(cat){return state.copies-(state.reserved[cat]||0)-state.deals.filter(d=>d.status!=='cancelled'&&((d.type==='exchange'&&d.outCat===cat)||d.type==='sale'&&d.cat===cat)).reduce((s,d)=>s+Number(d.outQty||d.qty),0)}function incoming(cat){return state.deals.filter(d=>d.status!=='cancelled'&&((d.type==='exchange'&&d.inCat===cat)||d.type==='purchase'&&d.cat===cat)).reduce((s,d)=>s+Number(d.inQty||d.qty),0)}function ownUsed(cat){return state.copies-(state.reserved[cat]||0)-available(cat)}function target(cat){return (state.reserved[cat]||0)+incoming(cat)}function written(d){return (d.ranges||[]).reduce((s,r)=>s+r.end-r.start+1,0)}function outCount(d){return Number(d.outQty||d.qty||0)}function typeName(d){return {exchange:'交換',purchase:'購入',sale:'売却'}[d.type]||''}function dDate(){if(!state.deadline)return null;let end=new Date(state.deadline+'T23:59:59+09:00');return Math.ceil((end-Date.now())/86400000)}function render(){
 document.getElementById('editionLabel').textContent=state.title||'投票管理';
 let days=dDate();document.getElementById('days').textContent=days===null?'—':days<0?'終了':days===0?'今日':days;
 document.getElementById('daysUnit').textContent=days===null?'':days>0?'日':days===0?'締切':'';
 document.getElementById('heroNote').textContent=state.deadline?`締切：${state.deadline.replaceAll('-','/')}`:'締切未設定';
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));

}
function needsMyPhoto(d){return d.type==='exchange'||d.type==='sale'}
function needsTheirPhoto(d){return d.type==='exchange'||d.type==='purchase'}
function needsWriting(d){return d.type!=='purchase'}
function unfinished(d){return (needsWriting(d)&&written(d)<outCount(d))||(needsMyPhoto(d)&&!d.myPhoto)||(needsTheirPhoto(d)&&!d.theirPhoto)||!d.payment}
function statusText(d){return [needsWriting(d)&&written(d)<outCount(d)?`未記入 ${fmt(outCount(d)-written(d))}票`:'',needsMyPhoto(d)&&!d.myPhoto?'写真未送信':'',needsTheirPhoto(d)&&!d.theirPhoto?'相手の写真待ち':'',!d.payment?(d.type==='purchase'?'未払い':'入金未確認'):''].filter(Boolean).join(' ・ ')||'確認完了'}
function typeClass(d){return 'type-'+d.type}
function home(){let active=state.deals.filter(d=>d.status!=='cancelled'),out=active.filter(needsWriting),todo=out.reduce((s,d)=>s+Math.max(0,outCount(d)-written(d)),0),waiting=active.filter(d=>needsTheirPhoto(d)&&!d.theirPhoto).length,complete=active.filter(d=>!unfinished(d)).length;let priority=active.filter(unfinished).slice(0,6);return `<div class="grid"><div class="card"><label>投票券</label><strong>${fmt(state.copies)}枚</strong></div><div class="card"><label>取引件数</label><strong>${fmt(active.length)}件</strong><span>完了 ${fmt(complete)}件</span></div><div class="card"><label>自分の未記入</label><strong>${fmt(todo)}枠</strong><span>取引分の記入残数</span></div><div class="card"><label>相手の写真待ち</label><strong>${fmt(waiting)}件</strong><span>受領確認前</span></div></div><div class="columns"><section class="panel"><h2>要対応</h2>${priority.length?priority.map(d=>`<div class="item row"><div><b>${esc(d.person)}</b> <span class="pill ${typeClass(d)}">${typeName(d)}</span><div class="subline">${esc(d.type==='exchange'?d.outCat:d.cat||'')}　${statusText(d)}</div></div><button class="quiet" data-detail="${d.id}">開く</button></div>`).join(''):'<div class="empty">今のところ対応待ちはありません。</div>'}</section><section class="panel"><h2>集めた票・確保した票</h2>${state.categories.filter(c=>target(c)>0).sort((a,b)=>target(b)-target(a)).slice(0,6).map(c=>`<div class="item row"><span>${esc(c)}</span><b>${fmt(target(c))}票</b></div>`).join('')||'<div class="empty">部門を設定すると表示されます。</div>'}<p class="muted small">自分用の確保分＋交換・購入で依頼した票数。記入・投函の完了数ではありません。</p></section></div>`}
function categories(){let cats=state.categories.filter(c=>c.includes(query));return `<section class="panel reserve-entry"><button class="primary reserve-open" id="openReserve">譲渡しない票を入力</button></section><section class="panel"><div class="row panel-top"><h2>部門別の残数</h2><button class="secondary" id="shareRemaining">交換募集用の表を見る</button></div><input class="search" id="search" placeholder="部門名で検索" value="${esc(query)}" aria-label="部門を検索"><div class="category-cards">${cats.map(c=>`<article class="category-card"><div class="category-main"><b>${esc(c)}</b><div><strong class="${available(c)<0?'warn':''}">${fmt(available(c))}</strong><span>票 出せる</span></div></div><div class="category-meta"><span>自分用 ${fmt(state.reserved[c])}</span><span>提供予定 ${fmt(ownUsed(c))}</span><span>集めた・確保 ${fmt(target(c))}</span></div></article>`).join('')}</div><div class="tablewrap category-table"><table><thead><tr><th>部門</th><th>自分用確保</th><th>提供を約束</th><th>出せる残り</th><th>集めた・確保した票</th></tr></thead><tbody>${cats.map(c=>`<tr><td><b>${esc(c)}</b></td><td>${fmt(state.reserved[c])}</td><td>${fmt(ownUsed(c))}</td><td class="number ${available(c)<0?'warn':''}">${fmt(available(c))}</td><td class="number">${fmt(target(c))}</td></tr>`).join('')}</tbody></table></div>${!cats.length?'<div class="empty">部門がありません。設定から追加できます。</div>':''}</section>`}
function reserveVotes(){
 modal('譲渡しない票を入力',`<p class="muted small">自分で使う票数を部門ごとに入力します。保存すると「出せる残り」から差し引かれます。</p>
 <form id="reserveForm"><label class="field">部門を探す<input id="reserveSearch" type="search" placeholder="部門名で検索"></label>
 <div class="reserve-list">${state.categories.map(c=>`<label class="reserve-row" data-name="${esc(c)}"><span>${esc(c)}<small>確保できる上限 ${fmt(state.copies-ownUsed(c))}票</small></span><span class="reserve-input"><input type="number" data-reserve="${esc(c)}" min="0" max="${state.copies-ownUsed(c)}" step="1" value="${state.reserved[c]||0}" aria-label="${esc(c)} の譲渡しない票数">票</span></label>`).join('')}</div>
 <div class="actions edit-actions"><button class="primary">確保数を保存</button></div></form>`);
 let search=document.getElementById('reserveSearch');
 search.oninput=()=>{let q=search.value.trim();document.querySelectorAll('.reserve-row').forEach(row=>row.hidden=!row.dataset.name.includes(q))};
 document.getElementById('reserveForm').onsubmit=e=>{
  e.preventDefault();let next={...state.reserved};
  for(let i of document.querySelectorAll('[data-reserve]')){
   let n=Number(i.value),cat=i.dataset.reserve;
   if(i.value.trim()===''||!Number.isSafeInteger(n)||n<0||n>state.copies-ownUsed(cat))return error(`${cat} の確保数は0〜${state.copies-ownUsed(cat)}票で入力してください。`);
   next[cat]=n;
  }
  let previous=state.reserved;state.reserved=next;
  try{save();closeModal()}catch{state.reserved=previous;error('保存できませんでした。もう一度お試しください。')}
 };
}

function shareRemaining(){
 let selected=new Set(state.categories.filter(c=>available(c)>0));
 modal('交換募集用の残数表',`<p class="muted small">載せたい部門を選んでください。縦向きの画像を保存できます。</p><div class="actions"><button class="quiet" id="selectAll">残数ありを全選択</button><button class="quiet" id="selectNone">すべて外す</button></div><div class="share-options">${state.categories.map(c=>`<label><input type="checkbox" data-share="${esc(c)}" ${selected.has(c)?'checked':''} ${available(c)<=0?'disabled':''}> ${esc(c)} <b>${fmt(Math.max(0,available(c)))}票</b></label>`).join('')}</div><div class="actions"><button class="primary" id="downloadShare">画像を保存（PNG）</button><button class="secondary" id="copyShare">部門名と残り票数をコピー</button></div><p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p><p class="muted small">画像は縦1200×1600pxです。部門名が長い場合は画像上で省略されます。</p><img id="sharePreview" class="share-preview" alt="交換募集用の部門別残数表">`);
 function imageData(){const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=1600;const ctx=canvas.getContext('2d');let cats=state.categories.filter(c=>selected.has(c)),cols=cats.length>36?3:cats.length>20?2:1,rows=Math.ceil(cats.length/cols),margin=54,gap=20,top=58,bottom=58,cellW=(1200-margin*2-gap*(cols-1))/cols,cellH=Math.min(70,(1600-top-bottom)/Math.max(rows,1));ctx.fillStyle='#fff9fd';ctx.fillRect(0,0,1200,1600);ctx.strokeStyle='#e9c8db';ctx.lineWidth=2;
 function clipText(text,width,font){ctx.font=font;if(ctx.measureText(text).width<=width)return text;while(text.length&&ctx.measureText(text+'…').width>width)text=text.slice(0,-1);return text+'…'}
 cats.forEach((cat,i)=>{const col=Math.floor(i/rows),row=i%rows,x=margin+col*(cellW+gap),y=top+row*cellH;ctx.fillStyle=row%2?'#fcecf5':'#fff';ctx.fillRect(x,y,cellW,cellH-3);ctx.fillStyle='#4e3344';let count=fmt(available(cat))+'票',countFont=cols===3?'bold 27px system-ui,sans-serif':'bold 30px system-ui,sans-serif';ctx.font=countFont;let countW=ctx.measureText(count).width;ctx.textBaseline='middle';ctx.fillStyle='#b62978';ctx.fillText(count,x+cellW-countW-12,y+(cellH-3)/2);let nameFont=cols===3?'25px system-ui,sans-serif':'28px system-ui,sans-serif';ctx.fillStyle='#4e3344';ctx.fillText(clipText(cat,cellW-countW-30,nameFont),x+10,y+(cellH-3)/2);ctx.beginPath();ctx.moveTo(x,y+cellH-2);ctx.lineTo(x+cellW,y+cellH-2);ctx.stroke()});return canvas.toDataURL('image/png')}
 function redraw(){document.getElementById('sharePreview').src=imageData()}
 document.querySelectorAll('[data-share]').forEach(i=>i.onchange=()=>{i.checked?selected.add(i.dataset.share):selected.delete(i.dataset.share);redraw()});
 document.getElementById('selectAll').onclick=()=>{document.querySelectorAll('[data-share]:not(:disabled)').forEach(i=>{i.checked=true;selected.add(i.dataset.share)});redraw()};
 document.getElementById('selectNone').onclick=()=>{document.querySelectorAll('[data-share]').forEach(i=>i.checked=false);selected.clear();redraw()};
 document.getElementById('downloadShare').onclick=()=>{if(!selected.size)return error('画像に載せる部門を選んでください。');const a=document.createElement('a');a.href=document.getElementById('sharePreview').src;a.download='交換可能な部門・残数.png';a.click()};
 document.getElementById('copyShare').onclick=async()=>{if(!selected.size)return error('コピーする部門を選んでください。');let lines=state.categories.filter(c=>selected.has(c)).map(c=>`${c} ${fmt(available(c))}票`).join('\n');try{await navigator.clipboard.writeText(lines);document.getElementById('copyStatus').textContent='選択した部門名と残り票数をコピーしました。'}catch{document.getElementById('copyStatus').textContent='コピーできませんでした。ブラウザの権限をご確認ください。'}};redraw()

function deals(){let list=state.deals.filter(d=>`${d.person} ${d.cat||''} ${d.outCat||''} ${d.inCat||''}`.includes(query)).filter(d=>showTrash?d.status==='cancelled':d.status!=='cancelled'&&(dealFilter==='all'||(dealFilter==='complete'?!unfinished(d):dealFilter==='unwritten'?needsWriting(d)&&written(d)<outCount(d):dealFilter==='unsent'?needsMyPhoto(d)&&!d.myPhoto:needsTheirPhoto(d)&&!d.theirPhoto)));return `<section class="panel"><h2>${showTrash?'取り消した取引':'取引一覧'}</h2><div class="filterbar"><input class="search" id="search" placeholder="相手・部門で検索" value="${esc(query)}" aria-label="取引を検索"><label class="filter-select">表示 <select id="dealFilter" aria-label="取引の状態で絞り込み" ${showTrash?'disabled':''}><option value="all">すべて</option><option value="unwritten">未記入</option><option value="unsent">未送信</option><option value="unreceived">未受領</option><option value="complete">完了済み</option></select></label><button class="trash-toggle ${showTrash?'active':''}" id="trashToggle" aria-label="${showTrash?'取引一覧に戻る':'取り消した取引を表示'}" title="${showTrash?'取引一覧に戻る':'取り消した取引を表示'}" aria-pressed="${showTrash}">🗑️</button></div>${showTrash?'<p class="muted small">取り消した取引は残数の計算に含まれません。復元すると取引一覧に戻ります。</p>':''}${list.map(dealCard).join('')||`<div class="empty">${showTrash?'取り消した取引はありません。':'該当する取引はありません。'}</div>`}</section>`}
function dealCard(d){let descr=d.type==='exchange'?`${esc(d.outCat)} ${fmt(d.outQty)}票 → ${esc(d.inCat)} ${fmt(d.inQty)}票`:d.type==='purchase'?`${esc(d.cat)} ${fmt(d.qty)}票を購入`:`${esc(d.cat)} ${fmt(d.qty)}票を売却`;return `<article class="listcard ${typeClass(d)}"><div class="row"><h3>${esc(d.person)} <span class="pill ${typeClass(d)}">${typeName(d)}${d.status==='cancelled'?'・取消':''}</span></h3><div class="inline"><button class="quiet" data-detail="${d.id}">詳細</button>${d.status==='cancelled'?`<button class="secondary" data-restore="${d.id}">復元</button>`:''}</div></div><div>${descr}</div><div class="subline">${d.type==='exchange'?'':`単価 ${fmt(d.price)}円 ／ 合計 ${fmt(d.qty*d.price)}円　`}${needsWriting(d)?`記入 ${fmt(written(d))}/${fmt(outCount(d))}　`:''}${needsMyPhoto(d)?(d.myPhoto?'写真送信済':'写真未送信')+'　':''}${needsTheirPhoto(d)?(d.theirPhoto?'相手の写真受領済':'相手待ち'):''}</div>${needsWriting(d)?`<div class="progress"><i style="width:${Math.min(100,100*written(d)/Math.max(1,outCount(d)))}%"></i></div>`:''}</article>`}
function bindContent(){if(tab==='settings')bindSettings();if(tab==='backup')bindBackup();document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{let d=state.deals.find(x=>x.id===b.dataset.restore);if(d&&d.status==='cancelled'){d.status='active';save()}});let trash=document.getElementById('trashToggle');if(trash)trash.onclick=()=>{showTrash=!showTrash;render()};let share=document.getElementById('shareRemaining');if(share)share.onclick=shareRemaining;let reserveButton=document.getElementById('openReserve');if(reserveButton)reserveButton.onclick=reserveVotes;let filter=document.getElementById('dealFilter');if(filter){filter.value=dealFilter;filter.onchange=()=>{dealFilter=filter.value;render()}}let s=document.getElementById('search');if(s)s.oninput=()=>{query=s.value;let pos=s.selectionStart;let focus=document.activeElement===s;document.getElementById('content').innerHTML=tab==='deals'?deals():categories();bindContent();if(focus){let n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)}}}
function modal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;let close=document.getElementById('modalClose');close.hidden=false;close.textContent='閉じる';close.classList.remove('modal-close-icon');document.getElementById('formError').textContent='';if(!document.getElementById('modal').open)document.getElementById('modal').showModal()}function closeModal(){document.getElementById('modal').close()}function error(msg){let el=document.getElementById(tab==='settings'||tab==='backup'?'pageError':'formError');if(el)el.textContent=msg}function field(name,label,type='text',value='',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}function sel(name,label,options){return `<label class="field">${label}<select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`}function catOpts(){return state.categories.map(c=>[c,c])}function formData(f){return Object.fromEntries(new FormData(f))}
function validBackup(data){return data&&typeof data==='object'&&Number.isInteger(data.copies)&&data.copies>=0&&data.copies<=100000&&Array.isArray(data.categories)&&data.categories.length<=100&&data.categories.every(c=>typeof c==='string'&&c.length<=200)&&Array.isArray(data.deals)&&data.deals.length<=5000&&data.deals.every(d=>d&&typeof d==='object'&&['exchange','purchase','sale'].includes(d.type)&&typeof d.person==='string'&&d.person.length<=300&&Array.isArray(d.ranges)&&d.ranges.every(r=>Number.isInteger(r.start)&&Number.isInteger(r.end)&&r.start>=1&&r.end>=r.start&&r.end<=data.copies))&&data.reserved&&typeof data.reserved==='object'&&Array.isArray(data.purchases)&&typeof data.title==='string'&&typeof data.deadline==='string'}function settings(){tab='settings';render()}
function settingsPage(){return `<section class="panel"><h2>基本設定</h2><form id="settingsForm"><div class="formgrid">${field('title','タイトル','text',state.title,'required')}${field('deadline','投票締切','date',state.deadline)}${field('copies','投票券の所持枚数','number',state.copies,'min="0" required')}<label class="field wide">部門名（1行に1部門）<textarea name="categories" rows="8" placeholder="いちばんいいコンビ&#10;犬っぽい">${esc(state.categories.join('\n'))}</textarea></label></div><p class="muted small">取引で使っている部門は削除できません。</p><div class="actions"><button class="primary">基本設定を保存</button></div></form><p class="error" id="pageError" role="alert"></p></section>`}
function bindSettings(){document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();let f=formData(e.target),cats=[...new Set(f.categories.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))],copies=Number(f.copies);if(copies<0||!Number.isInteger(copies))return error('枚数を確認してください。');if(state.categories.some(c=>!cats.includes(c)&&state.deals.some(d=>[d.cat,d.outCat,d.inCat].includes(c))))return error('取引で使っている部門は削除できません。');if(cats.some(c=>copies-(state.reserved[c]||0)-ownUsed(c)<0))return error('枚数が既に約束した票数を下回ります。');state.title=f.title;state.deadline=f.deadline;state.copies=copies;state.categories=cats;save()}}
function backupPage(){return `<section class="panel backup-panel"><h2>バックアップ</h2><p>記録はこのブラウザに保存されます。別の端末へ自動で同期されず、ブラウザのデータを削除すると消える場合があります。ブラウザのデータを削除、または別の端末に移行する際は、バックアップデータを保存してください。</p><div class="actions"><button class="primary" id="exportBtn">バックアップをダウンロード</button></div><h3 class="sectiontitle">バックアップから復元</h3><p>保存したJSONファイルを読み込めます。現在の記録は置き換わります。</p><label class="quiet backup-import">バックアップを読み込む<input id="importInput" type="file" accept="application/json,.json" hidden></label><p class="error" id="pageError" role="alert"></p></section>`}
function bindBackup(){document.getElementById('exportBtn').onclick=downloadBackup;document.getElementById('importInput').onchange=async e=>{try{let file=e.target.files[0];if(!file)return;let data=JSON.parse(await file.text());if(!validBackup(data))throw Error();data.deals.forEach(d=>{d.image=safeImage(d.image)});if(!confirm('今の記録をバックアップの内容で置き換えますか？'))return;state=data;save()}catch{error('読み込めるバックアップファイルではありません。')}}}
function copies(){modal('投票券を追加',`<form id="copiesForm" class="formgrid">${field('amount','追加する枚数','number','','min="1" required')}${field('memo','メモ（任意）','text','','placeholder="追加購入など"')}<div class="wide muted">現在 ${fmt(state.copies)}枚。追加分は全ての部門の出せる残りに反映します。</div><div class="actions wide"><button class="primary">追加する</button></div></form>`);document.getElementById('copiesForm').onsubmit=e=>{e.preventDefault();let f=formData(e.target),n=Number(f.amount);if(!Number.isInteger(n)||n<1)return error('1枚以上を入力してください。');state.copies+=n;state.purchases.push({id:id(),amount:n,memo:f.memo,date:new Date().toISOString()});save();closeModal()}}
function deal(){if(!state.categories.length)return settings();modal('取引を登録',`<form id="dealForm"><div class="formgrid">${sel('type','取引の種類',[['exchange','交換'],['purchase','枠を購入'],['sale','枠を売却']])}${field('person','相手（アカウント名など）','text','','required')}<div id="dealFields" class="wide formgrid"></div>${field('target','投票先（番号・名前）','text')}${field('reason','理由欄の指定','text')}<label class="field wide">相手からの指定・メモ<textarea name="notes" placeholder="画像で届いた指定の補足など"></textarea></label><label class="field wide">指定画像（任意・端末内に保存）<input name="image" type="file" accept="image/*"></label></div><div class="actions"><button class="primary">登録する</button></div></form>`);let f=document.getElementById('dealForm'),type=f.elements.type;function fields(){document.getElementById('dealFields').innerHTML=type.value==='exchange'?`${sel('outCat','自分が書く部門',catOpts())}${field('outQty','自分が書く票数','number','','min="1" required')}${sel('inCat','相手に書いてもらう部門',catOpts())}${field('inQty','相手に書いてもらう票数','number','','min="1" required')}`:`${sel('cat',type.value==='purchase'?'購入する部門':'売却する部門',catOpts())}${field('qty','票数','number','','min="1" required')}${field('price','1枠あたりの金額（円）','number',0,'min="0" required')}`};type.onchange=fields;fields();f.onsubmit=async e=>{e.preventDefault();let v=formData(f),n=Number(v.outQty||v.qty);if(!v.person.trim()||!Number.isInteger(n)||n<1)return error('相手と票数を確認してください。');if(v.type==='exchange'&&(!Number.isInteger(Number(v.inQty))||Number(v.inQty)<1))return error('受け取る票数を確認してください。');if(v.type!=='exchange'&&(!Number.isFinite(Number(v.price))||Number(v.price)<0))return error('単価を確認してください。');let c=v.type==='exchange'?v.outCat:v.cat;if(v.type!=='purchase'&&available(c)<n)return error(`${c} の出せる残りは ${available(c)}票です。`);let file=f.elements.image.files[0],image='';if(file){if(file.size>2e6)return error('画像は2MB以下にしてください。');if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))return error('PNG・JPEG・WebP・GIF画像を選んでください。');image=await new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}let d={id:id(),type:v.type,person:v.person.trim(),cat:v.cat||'',qty:Number(v.qty||0),outCat:v.outCat||'',outQty:Number(v.outQty||0),inCat:v.inCat||'',inQty:Number(v.inQty||0),price:Number(v.price||0),target:v.target,reason:v.reason,notes:v.notes,image,created:new Date().toISOString(),ranges:[],myPhoto:false,theirPhoto:false,payment:v.type==='exchange',status:'active'};state.deals.unshift(d);try{save();closeModal()}catch{state.deals.shift();error('保存容量が不足しました。画像を小さくして再度お試しください。')}}}
function editDeal(uid){
 const d=state.deals.find(x=>x.id===uid);
 if(!d||d.status==='cancelled')return;
 modal('取引内容を編集',`<p class="edit-intro">変更後の部門と票数に合わせて残数も更新されます。記入済みの番号と確認状況は引き継ぎます。</p>
 <form id="editDealForm"><div class="formgrid">
 ${sel('type','取引の種類',[['exchange','交換'],['purchase','枠を購入'],['sale','枠を売却']])}
 ${field('person','相手（アカウント名など）','text',d.person,'required')}
 <div id="editDealFields" class="wide formgrid"></div>
 ${field('target','投票先（番号・名前）','text',d.target)}
 ${field('reason','理由欄の指定','text',d.reason)}
 <label class="field wide">相手からの指定・メモ<textarea name="notes" placeholder="画像で届いた指定の補足など">${esc(d.notes)}</textarea></label>
 ${safeImage(d.image)?`<div class="edit-image wide"><img src="${safeImage(d.image)}" alt="現在の指定画像"><label><input type="checkbox" name="removeImage"> 現在の画像を削除</label></div>`:''}
 <label class="field wide">指定画像を変更（任意）<input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
 </div><div class="actions edit-actions"><button class="primary">変更を保存</button><button type="button" class="quiet" id="editDealBack">詳細に戻る</button></div></form>`);
 document.getElementById('modalClose').hidden=true;
 const f=document.getElementById('editDealForm'),type=f.elements.type;
 type.value=d.type;
 function fields(){
  let exchange=type.value==='exchange';
  document.getElementById('editDealFields').innerHTML=exchange?
   `${sel('outCat','自分が書く部門',catOpts())}${field('outQty','自分が書く票数','number',d.type==='exchange'?d.outQty:d.qty,'min="1" step="1" required')}${sel('inCat','相手に書いてもらう部門',catOpts())}${field('inQty','相手に書いてもらう票数','number',d.type==='exchange'?d.inQty:d.qty,'min="1" step="1" required')}`:
   `${sel('cat',type.value==='purchase'?'購入する部門':'売却する部門',catOpts())}${field('qty','票数','number',d.type==='exchange'?d.outQty:d.qty,'min="1" step="1" required')}${field('price','1枠あたりの金額（円）','number',d.price,'min="0" step="1" required')}`;
  if(exchange){f.elements.outCat.value=d.outCat||d.cat||state.categories[0];f.elements.inCat.value=d.inCat||d.cat||state.categories[0]}
  else f.elements.cat.value=d.cat||d.outCat||state.categories[0];
 }
 type.onchange=fields;fields();
 document.getElementById('editDealBack').onclick=()=>detail(uid);
 f.onsubmit=async e=>{
  e.preventDefault();
  let v=formData(f),out=v.type==='exchange'?v.outCat:v.cat,qty=Number(v.type==='exchange'?v.outQty:v.qty),inQty=Number(v.inQty),price=Number(v.price);
  if(!['exchange','purchase','sale'].includes(v.type)||!v.person.trim())return error('取引の種類と相手を確認してください。');
  if(!state.categories.includes(out)||(v.type==='exchange'&&!state.categories.includes(v.inCat)))return error('部門を選び直してください。');
  if(!Number.isSafeInteger(qty)||qty<1)return error('票数は1以上の整数で入力してください。');
  if(v.type==='exchange'&&(!Number.isSafeInteger(inQty)||inQty<1))return error('受け取る票数を確認してください。');
  if(v.type!=='exchange'&&(!Number.isSafeInteger(price)||price<0))return error('単価は0以上の整数で入力してください。');
  const ranges=d.ranges||[],used=written(d);
  if(used&&v.type==='purchase')return error('記入済み番号がある取引は購入に変更できません。先に詳細から番号を削除してください。');
  if(used>qty)return error(`記入済みの ${used} 票より少ない票数には変更できません。`);
  const oldOut=d.type==='exchange'?d.outCat:d.type==='sale'?d.cat:null;
  const remaining=available(out)+(oldOut===out?outCount(d):0);
  if(v.type!=='purchase'&&remaining<qty)return error(`${out} の出せる残りは ${remaining} 票です。`);
  if(used&&out!==oldOut&&ranges.some(r=>state.deals.some(other=>other.id!==uid&&other.status!=='cancelled'&&needsWriting(other)&&(other.type==='exchange'?other.outCat:other.cat)===out&&(other.ranges||[]).some(x=>r.start<=x.end&&r.end>=x.start))))return error('変更先の部門に、記入済み番号と重なる取引があります。');
  let image=v.removeImage?'':safeImage(d.image),file=f.elements.image.files[0];
  if(file){
   if(file.size>2e6)return error('画像は2MB以下にしてください。');
   if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))return error('PNG・JPEG・WebP・GIF画像を選んでください。');
   try{image=await new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}catch{return error('画像を読み込めませんでした。')}
   if(!safeImage(image))return error('画像を保存できません。別の画像を選んでください。');
  }
  const before={...d};
  Object.assign(d,{type:v.type,person:v.person.trim(),cat:v.type==='exchange'?'':v.cat,qty:v.type==='exchange'?0:qty,outCat:v.type==='exchange'?v.outCat:'',outQty:v.type==='exchange'?qty:0,inCat:v.type==='exchange'?v.inCat:'',inQty:v.type==='exchange'?inQty:0,price:v.type==='exchange'?0:price,target:v.target,reason:v.reason,notes:v.notes,image,myPhoto:v.type==='purchase'?false:d.myPhoto,theirPhoto:v.type==='sale'?false:d.theirPhoto,payment:v.type==='exchange'?true:d.type==='exchange'?false:d.payment});
  try{save();detail(uid)}catch{Object.assign(d,before);error('保存容量が不足しました。画像を小さくして再度お試しください。')}
 };
}
function detail(uid){let d=state.deals.find(x=>x.id===uid);if(!d)return;let isOut=needsWriting(d),max=outCount(d);d.ranges=d.ranges||[];modal(`${d.person} ／ ${typeName(d)}`,`<div class="subline">${d.type==='exchange'?`自分：${esc(d.outCat)} ${d.outQty}票 ／ 相手：${esc(d.inCat)} ${d.inQty}票`:`${esc(d.cat)} ${d.qty}票 ／ 単価 ${fmt(d.price)}円・合計 ${fmt(d.qty*d.price)}円`}</div><div class="subline">投票先：${esc(d.target)||'未登録'}<br>理由欄：${esc(d.reason)||'未登録'}<br>メモ：${esc(d.notes)||'なし'}</div><div class="actions detail-edit-action"><button class="primary" id="editDeal" type="button" ${d.status==='cancelled'?'hidden':''}>取引内容を編集</button></div>${safeImage(d.image)?`<p><img class="detail-image" src="${safeImage(d.image)}" alt="保存された指定画像"></p>`:''}${isOut?`<h3 class="sectiontitle">記入した投票用紙の番号（${written(d)}/${max}票）</h3><div class="range-list">${d.ranges.map((r,i)=>`<div class="range-row"><b>No.${r.start}〜${r.end}</b><div><button type="button" class="quiet" data-edit-range="${i}">修正</button> <button type="button" class="danger" data-delete-range="${i}">削除</button></div></div>`).join('')||'<p class="muted">まだ記録がありません。</p>'}</div><form id="rangeForm" class="inline">${field('start','開始番号','number','','min="1" required')}${field('end','終了番号','number','','min="1" required')}<button class="secondary" id="rangeSubmit">範囲を追加</button><button type="button" class="quiet" id="rangeReset" hidden>修正をやめる</button></form><p class="muted small">同じ部門で既に記録した範囲との重複は防ぎます。番号は投票券に付けた通し番号です。</p>`:''}<h3 class="sectiontitle">取引の確認</h3><div class="formgrid">${needsMyPhoto(d)?`<label><input type="checkbox" id="myPhoto" ${d.myPhoto?'checked':''}> 自分の写真を送信済み</label>`:''}${needsTheirPhoto(d)?`<label><input type="checkbox" id="theirPhoto" ${d.theirPhoto?'checked':''}> 相手の写真を受領済み</label>`:''}${d.type!=='exchange'?`<label><input type="checkbox" id="payment" ${d.payment?'checked':''}> ${d.type==='purchase'?'支払済み':'入金確認済み'}</label>`:''}</div><div class="actions"><button class="quiet" id="saveChecks">確認状況を保存</button><button class="danger" id="cancelDeal">${d.status==='cancelled'?'取引を復元':'取引を取り消す'}</button></div>`);
 if(isOut){let editing=-1,form=document.getElementById('rangeForm');document.querySelectorAll('[data-edit-range]').forEach(b=>b.onclick=()=>{editing=Number(b.dataset.editRange);form.elements.start.value=d.ranges[editing].start;form.elements.end.value=d.ranges[editing].end;document.getElementById('rangeSubmit').textContent='修正を保存';document.getElementById('rangeReset').hidden=false;form.elements.start.focus()});document.getElementById('rangeReset').onclick=()=>{editing=-1;form.reset();document.getElementById('rangeSubmit').textContent='範囲を追加';document.getElementById('rangeReset').hidden=true};document.querySelectorAll('[data-delete-range]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.deleteRange);if(!confirm(`No.${d.ranges[i].start}〜${d.ranges[i].end} の記録を削除しますか？`))return;d.ranges.splice(i,1);save();detail(uid)});form.onsubmit=e=>{e.preventDefault();let f=formData(form),a=Number(f.start),b=Number(f.end);if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b<a||b>state.copies)return error(`1〜${state.copies}の範囲で入力してください。`);let previous=editing>=0?d.ranges[editing].end-d.ranges[editing].start+1:0;if(written(d)-previous+b-a+1>max)return error('約束した票数を超えます。');let cat=d.type==='exchange'?d.outCat:d.cat;if(state.deals.some(x=>x.status!=='cancelled'&&(x.type==='exchange'?x.outCat:x.cat)===cat&&(x.ranges||[]).some((r,i)=>(x.id!==d.id||i!==editing)&&a<=r.end&&b>=r.start)))return error('この部門で既に記入済みの番号と重なります。');if(editing>=0)d.ranges[editing]={start:a,end:b};else d.ranges.push({start:a,end:b});save();detail(uid)}}
 let modalClose=document.getElementById('modalClose');modalClose.textContent='✕';modalClose.classList.add('modal-close-icon');document.getElementById('editDeal').onclick=()=>editDeal(uid);document.getElementById('saveChecks').onclick=()=>{if(needsMyPhoto(d))d.myPhoto=document.getElementById('myPhoto').checked;if(needsTheirPhoto(d))d.theirPhoto=document.getElementById('theirPhoto').checked;if(d.type!=='exchange')d.payment=document.getElementById('payment').checked;save();closeModal()};document.getElementById('cancelDeal').onclick=()=>{if(d.status!=='cancelled'&&!confirm('取引を取り消しますか？ 約束済みの枠が残数に戻ります。'))return;d.status=d.status==='cancelled'?'active':'cancelled';save();closeModal()}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;query='';dealFilter='all';showTrash=false;render()});document.getElementById('helpBtn').onclick=showGuide;document.getElementById('addDeal').onclick=deal;document.getElementById('addCopies').onclick=copies;render();
</script></body></html>
